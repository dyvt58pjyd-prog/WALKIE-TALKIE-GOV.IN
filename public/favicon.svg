<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a8" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffd700" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="50" cy="50" r="48" fill="#0d141c" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#253545" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Ashoka Lions Capital Stylized Silhouette -->
  <!-- Center Lion Head & Mane -->
  <path d="M50 14 C46 14 43 17 43 21 C43 23 44 25 45 27 C42 27 40 30 40 33 C40 37 43 40 45 42 C45 47 47 51 47 54 L53 54 C53 51 55 47 55 42 C57 40 60 37 60 33 C60 30 58 27 55 27 C56 25 57 23 57 21 C57 17 54 14 50 14 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Left Lion Profile -->
  <path d="M43 22 C39 21 35 24 35 28 C35 31 37 33 38 34 C35 35 33 38 33 41 C33 45 36 48 39 49 C41 49 42 47 43 45 Z" fill="url(#goldGrad)" opacity="0.95"/>
  
  <!-- Right Lion Profile -->
  <path d="M57 22 C61 21 65 24 65 28 C65 31 63 33 62 34 C65 35 67 38 67 41 C67 45 64 48 61 49 C59 49 58 47 57 45 Z" fill="url(#goldGrad)" opacity="0.95"/>

  <!-- Abacus Base -->
  <rect x="25" y="56" width="50" height="6" rx="2" fill="url(#goldGrad)"/>

  <!-- Ashoka Chakra (Dharma Wheel) in Center of Abacus -->
  <circle cx="50" cy="59" r="6" fill="#0d141c" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <circle cx="50" cy="59" r="1.5" fill="url(#goldGrad)"/>
  <!-- 8 Cardinal Spokes (representing 24 spokes for icon scale) -->
  <line x1="50" y1="53.5" x2="50" y2="64.5" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <line x1="44.5" y1="59" x2="55.5" y2="59" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <line x1="46" y1="55" x2="54" y2="63" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <line x1="46" y1="63" x2="54" y2="55" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Galloping Horse (Left) & Bull (Right) stylized figures -->
  <path d="M32 58 C30 57 28 58 27 60 L35 60 C34 58 33 58 32 58 Z" fill="#0d141c"/>
  <path d="M68 58 C70 57 72 58 73 60 L65 60 C66 58 67 58 68 58 Z" fill="#0d141c"/>

  <!-- Lotus Pedestal Base -->
  <path d="M22 64 C22 63 26 62 50 62 C74 62 78 63 78 64 L74 69 C70 70 58 71 50 71 C42 71 30 70 26 69 Z" fill="url(#goldGrad)"/>

  <!-- Motto Plinth with "सत्यमेव जयते" (Satyameva Jayate) -->
  <rect x="20" y="73" width="60" height="10" rx="2" fill="#18232e" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="50" y="80.5" fill="url(#goldGrad)" font-size="6.5" font-family="'Devanagari MT', 'Kohinoor Devanagari', 'Noto Sans Devanagari', sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="0.5">सत्यमेव जयते</text>

  <!-- Bottom Tricolor Arc Accent -->
  <path d="M30 89 A 44 44 0 0 0 42 92" stroke="#FF9933" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M44 92.5 A 44 44 0 0 0 56 92.5" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M58 92 A 44 44 0 0 0 70 89" stroke="#138808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
